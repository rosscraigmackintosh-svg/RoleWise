<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />
<title>Rolewise — Role analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  /* ══════════════════════════════════════════════════════════════════
     GLOBAL SYSTEM — shared with Overview / Decisions / Review / etc.
     ══════════════════════════════════════════════════════════════════ */
  :root {
    --bg:          oklch(99% 0.003 80);
    --bg-sidebar:  oklch(97.2% 0.004 80);
    --bg-card:    #ffffff;
    --bg-hover:   oklch(96% 0.004 80);
    --bg-subtle:  oklch(97.8% 0.004 80);
    --bg-panel:   oklch(98% 0.003 80);

    --border:     oklch(92% 0.004 80);
    --border-strong: oklch(87% 0.005 80);

    --ink:        oklch(22% 0.01 80);
    --ink-heading: oklch(18% 0.012 80);
    --ink-muted:  oklch(50% 0.01 80);
    --ink-subtle: oklch(62% 0.008 80);

    --accent:     oklch(45% 0.06 250);
    --accent-bg:  oklch(95% 0.015 250);

    --up:    oklch(50% 0.08 150);
    --down:  oklch(55% 0.06 50);

    --sidebar-w:  240px;
    --content-max: 1200px;

    --radius-card: 12px;
    --radius-sm: 6px;

    --dur: 180ms;
    --ease: cubic-bezier(0.2, 0, 0, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "cv11", "ss01";
  }

  button, a { font-family: inherit; }
  .num { font-family: 'Geist Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  ::selection { background: var(--accent-bg); color: var(--ink-heading); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: oklch(88% 0.005 80); border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: oklch(80% 0.005 80); }

  .app {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    min-height: 100vh;
  }

  /* Sidebar (shared) */
  .sidebar {
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    padding: 24px 16px 20px;
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh;
  }
  .brand { padding: 4px 8px 28px; }
  .brand-mark { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 15px; color: var(--ink-heading); letter-spacing: -0.01em; }
  .brand-dot { width: 14px; height: 14px; background: var(--ink-heading); border-radius: 3px; position: relative; }
  .brand-dot::after { content: ''; position: absolute; inset: 3px 3px auto auto; width: 4px; height: 4px; background: var(--bg-sidebar); border-radius: 50%; }
  .brand-tag { font-size: 12px; color: var(--ink-subtle); margin-top: 6px; padding-left: 22px; letter-spacing: 0.005em; }
  .nav-group { margin-bottom: 20px; }
  .nav-label { font-size: 11px; color: var(--ink-subtle); padding: 0 8px 6px; letter-spacing: 0.04em; }
  .nav-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 10px; border-radius: var(--radius-sm);
    color: var(--ink-muted); cursor: pointer; user-select: none;
    border: none; background: transparent; width: 100%;
    text-align: left; font-size: 14px; margin-bottom: 1px; position: relative;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .nav-item:hover { background: var(--bg-hover); color: var(--ink); }
  .nav-item.active { background: var(--bg-hover); color: var(--ink-heading); font-weight: 500; }
  .nav-item.active::before { content: ''; position: absolute; left: -16px; top: 6px; bottom: 6px; width: 2px; background: var(--accent); border-radius: 0 2px 2px 0; }
  .nav-count { font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--ink-subtle); font-weight: 400; }
  .nav-plus-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .sidebar-footer { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); }
  .profile { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: var(--radius-sm); cursor: pointer; }
  .profile:hover { background: var(--bg-hover); }
  .avatar { width: 26px; height: 26px; border-radius: 5px; background: oklch(80% 0.02 60); color: oklch(30% 0.02 60); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; letter-spacing: 0.02em; }
  .profile-name { font-size: 13px; color: var(--ink); line-height: 1.1; }
  .profile-mail { font-size: 11px; color: var(--ink-subtle); line-height: 1.2; margin-top: 1px; }
  .upgrade { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-card); font-size: 12px; color: var(--ink-muted); cursor: pointer; }
  .upgrade:hover { border-color: var(--border-strong); }
  .upgrade-t { color: var(--ink-heading); font-weight: 500; font-size: 12.5px; display: flex; align-items: center; justify-content: space-between; }

  .main { min-width: 0; padding: 48px 56px 96px; }
  .content { max-width: var(--content-max); margin: 0 auto; }

  /* ══════════════════════════════════════════════════════════════════
     ROLE ANALYSIS — page specific
     Editorial, two-column, document-first. Not a dashboard.
     ══════════════════════════════════════════════════════════════════ */

  /* Top bar — very light. A crumb and right-side utilities. */
  .ra-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 28px;
  }
  .ra-back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: var(--ink-muted);
    font-size: 13px;
    letter-spacing: -0.003em;
    padding: 4px 8px 4px 0;
    border-radius: 4px;
    transition: color var(--dur) var(--ease);
  }
  .ra-back:hover { color: var(--ink-heading); }
  .ra-back-arrow {
    display: inline-block;
    width: 14px;
    text-align: center;
    color: var(--ink-subtle);
  }
  .ra-top-utils {
    display: inline-flex;
    align-items: center;
    gap: 18px;
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    color: var(--ink-subtle);
    letter-spacing: 0.03em;
  }
  .ra-util {
    display: inline-flex; align-items: center; gap: 6px;
    text-decoration: none;
    color: var(--ink-subtle);
    transition: color var(--dur) var(--ease);
  }
  .ra-util:hover { color: var(--ink); }
  .ra-util-tick { width: 8px; height: 1px; background: currentColor; opacity: 0.5; }

  /* Two-column layout */
  .ra-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 72px;
    align-items: start;
  }

  /* ── HEADER (inside left column) ── */
  .ra-header {
    padding: 8px 0 36px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 40px;
  }
  .ra-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    color: var(--ink-subtle);
    letter-spacing: 0.04em;
    text-transform: lowercase;
    margin-bottom: 16px;
  }
  .ra-eyebrow-tick {
    width: 8px; height: 1px;
    background: var(--border-strong);
    display: inline-block;
  }
  .ra-title {
    margin: 0 0 10px;
    font-size: 36px;
    font-weight: 400;
    color: var(--ink-heading);
    letter-spacing: -0.022em;
    line-height: 1.12;
    text-wrap: balance;
  }
  .ra-title .co {
    color: var(--ink-muted);
    font-weight: 300;
  }
  .ra-title .dot {
    color: var(--ink-subtle);
    margin: 0 10px;
    font-weight: 300;
  }
  .ra-meta {
    margin: 0;
    font-family: 'Geist Mono', monospace;
    font-size: 12px;
    color: var(--ink-muted);
    letter-spacing: 0.005em;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .ra-meta .sep {
    width: 3px; height: 3px; border-radius: 50%;
    background: var(--border-strong);
    display: inline-block;
  }

  /* ── SECTIONS ── */
  .ra-section { padding: 36px 0; }
  .ra-section + .ra-section { border-top: 1px dashed var(--border); }
  .ra-section:first-of-type { padding-top: 0; }

  .ra-sec-label {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 18px;
  }
  .ra-sec-num {
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    color: var(--ink-subtle);
    letter-spacing: 0.04em;
    min-width: 28px;
  }
  .ra-sec-title {
    margin: 0;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-heading);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* Section 1 — the insight. Larger, editorial. */
  .ra-lede {
    font-family: 'Instrument Serif', 'Geist', serif;
    font-size: 28px;
    line-height: 1.3;
    color: var(--ink-heading);
    letter-spacing: -0.015em;
    font-weight: 400;
    margin: 0;
    max-width: 34ch;
    text-wrap: pretty;
  }
  .ra-lede em {
    font-style: italic;
    color: var(--ink);
  }

  /* Paragraphs */
  .ra-p {
    font-size: 15px;
    line-height: 1.65;
    color: var(--ink);
    letter-spacing: -0.005em;
    margin: 0 0 14px;
    max-width: 62ch;
    text-wrap: pretty;
  }
  .ra-p:last-child { margin-bottom: 0; }

  .ra-note {
    font-size: 12.5px;
    color: var(--ink-subtle);
    font-style: italic;
    letter-spacing: -0.003em;
    margin: 14px 0 0;
    padding-left: 12px;
    border-left: 1px solid var(--border-strong);
    max-width: 52ch;
    text-wrap: pretty;
  }

  /* Arrow bullet list */
  .ra-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 62ch;
  }
  .ra-list li {
    font-size: 15px;
    line-height: 1.55;
    color: var(--ink);
    letter-spacing: -0.004em;
    padding-left: 24px;
    position: relative;
    text-wrap: pretty;
  }
  .ra-list li::before {
    content: '→';
    position: absolute;
    left: 0; top: 0;
    color: var(--ink-subtle);
    font-family: 'Geist Mono', monospace;
    font-size: 13px;
    line-height: 1.7;
  }

  /* Questions variant — slightly different feel */
  .ra-list.questions li {
    font-size: 15px;
    color: var(--ink-heading);
  }
  .ra-list.questions li::before {
    content: '?';
    color: var(--ink-subtle);
    font-style: italic;
    font-family: 'Instrument Serif', serif;
    font-size: 16px;
  }

  /* Suggested actions — inline, subdued */
  .ra-actions-list {
    list-style: none;
    margin: 0; padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .ra-actions-list li {
    padding: 14px 0;
    border-bottom: 1px dashed var(--border);
    font-size: 15px;
    color: var(--ink);
    letter-spacing: -0.004em;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 14px;
    align-items: baseline;
    text-wrap: pretty;
  }
  .ra-actions-list li:first-child { padding-top: 4px; }
  .ra-actions-list li:last-child { border-bottom: none; }
  .ra-actions-list li .idx {
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    color: var(--ink-subtle);
    letter-spacing: 0.04em;
    padding-top: 2px;
    min-width: 18px;
  }
  .ra-actions-list li .do {
    font-weight: 500;
    color: var(--ink-heading);
    margin-right: 8px;
  }
  .ra-actions-list li .qualifier {
    color: var(--ink-muted);
    font-size: 14px;
  }
  .ra-actions-list li .mark {
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    color: var(--ink-subtle);
    letter-spacing: 0.04em;
    opacity: 0;
    transition: opacity var(--dur) var(--ease);
    cursor: pointer;
  }
  .ra-actions-list li:hover .mark { opacity: 1; }

  /* Close — essay-style end mark */
  .ra-close {
    margin-top: 48px;
    padding-top: 28px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
  }
  .ra-close-l {
    font-size: 12.5px;
    color: var(--ink-muted);
    font-style: italic;
    letter-spacing: -0.003em;
    max-width: 52ch;
    text-wrap: pretty;
  }
  .ra-close-r {
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    color: var(--ink-subtle);
    letter-spacing: 0.02em;
  }

  /* ══════════════════════════════════════════════════════════════════
     RIGHT PANEL
     ══════════════════════════════════════════════════════════════════ */
  .ra-side {
    position: sticky;
    top: 48px;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }
  .ra-block + .ra-block {
    padding-top: 28px;
    border-top: 1px solid var(--border);
  }
  .ra-block-label {
    font-family: 'Geist Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-subtle);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ra-block-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Status */
  .ra-status-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 13px;
    color: var(--ink);
  }
  .ra-status-row + .ra-status-row {
    border-top: 1px dashed var(--border);
  }
  .ra-status-k {
    color: var(--ink-muted);
    font-size: 12.5px;
    letter-spacing: -0.002em;
  }
  .ra-status-v {
    font-size: 13px;
    color: var(--ink-heading);
    letter-spacing: -0.003em;
  }
  .ra-status-v.mono { font-family: 'Geist Mono', monospace; font-size: 12px; }
  .ra-status-v.pulse {
    display: inline-flex; align-items: center; gap: 8px;
  }
  .ra-pulse-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--down);
    display: inline-block;
    box-shadow: 0 0 0 3px oklch(55% 0.06 50 / 0.12);
  }
  .ra-interp {
    margin-top: 14px;
    padding: 11px 12px;
    background: var(--bg-subtle);
    border-radius: 8px;
    font-size: 12.5px;
    color: var(--ink);
    letter-spacing: -0.003em;
    line-height: 1.5;
    text-wrap: pretty;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .ra-interp-glyph {
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    color: var(--ink-subtle);
    letter-spacing: 0.04em;
    padding-top: 2px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .ra-interp-t { flex: 1; font-style: italic; }

  /* Actions (2x2 grid of minimal buttons) */
  .ra-actions {
    margin-top: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .ra-btn {
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--ink);
    padding: 9px 10px;
    font-size: 12.5px;
    letter-spacing: -0.003em;
    border-radius: 6px;
    cursor: pointer;
    text-align: left;
    transition: all var(--dur) var(--ease);
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .ra-btn:hover { border-color: var(--border-strong); background: var(--bg-hover); color: var(--ink-heading); }
  .ra-btn .glyph {
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    color: var(--ink-subtle);
    font-weight: 400;
  }

  /* At a glance — tidy key/value stack */
  .ra-facts {
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .ra-fact {
    display: grid;
    grid-template-columns: 90px 1fr;
    gap: 14px;
    padding: 9px 0;
    border-bottom: 1px dashed var(--border);
    align-items: baseline;
  }
  .ra-fact:last-child { border-bottom: none; }
  .ra-fact-k {
    font-size: 11px;
    color: var(--ink-subtle);
    font-family: 'Geist Mono', monospace;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .ra-fact-v {
    font-size: 13px;
    color: var(--ink-heading);
    letter-spacing: -0.003em;
    line-height: 1.4;
  }
  .ra-fact-v .sub {
    display: block;
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    color: var(--ink-subtle);
    margin-top: 2px;
    letter-spacing: 0;
  }

  /* Key signals */
  .ra-signals {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .ra-signal {
    display: grid;
    grid-template-columns: 16px 1fr;
    gap: 10px;
    align-items: baseline;
    font-size: 13px;
    color: var(--ink);
    letter-spacing: -0.003em;
    line-height: 1.45;
    text-wrap: pretty;
  }
  .ra-signal-glyph {
    font-family: 'Geist Mono', monospace;
    font-size: 13px;
    font-weight: 400;
    line-height: 1.3;
  }
  .ra-signal[data-dir='up']     .ra-signal-glyph { color: var(--up); }
  .ra-signal[data-dir='down']   .ra-signal-glyph { color: var(--down); }
  .ra-signal[data-dir='flat']   .ra-signal-glyph { color: var(--ink-subtle); }
  .ra-signal-sub {
    display: block;
    font-size: 11.5px;
    color: var(--ink-subtle);
    margin-top: 2px;
    letter-spacing: 0;
  }

  /* Notes block */
  .ra-notes {
    font-size: 13px;
    line-height: 1.6;
    color: var(--ink);
    letter-spacing: -0.003em;
    text-wrap: pretty;
    font-family: 'Instrument Serif', serif;
    font-size: 15px;
    font-weight: 400;
  }
  .ra-notes-edit {
    display: inline-block;
    margin-top: 10px;
    font-family: 'Geist Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-subtle);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    text-decoration: none;
  }
  .ra-notes-edit:hover { color: var(--ink); }

  /* ══════════════════════════════════════════════════════════════════
     INTERACTION LAYER — inline prompts, slide-in, toast
     Low-ceremony. All state updates are instant + reversible.
     ══════════════════════════════════════════════════════════════════ */

  /* Active action highlight */
  .ra-btn[data-active='true'] {
    border-color: var(--ink-heading);
    background: var(--bg-subtle);
    color: var(--ink-heading);
  }

  /* Status block wrapper — gives actions + prompts a shared rhythm */
  .ra-actions-wrap { margin-top: 16px; }

  .ra-patterns-note {
    margin-top: 12px;
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    color: var(--ink-subtle);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 0.7;
  }
  .ra-patterns-note::before {
    content: '';
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--ink-subtle);
    display: inline-block;
  }

  /* ── Inline prompts ── */
  .ra-prompt {
    margin-top: 14px;
    padding: 14px 14px 12px;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: 8px;
    animation: ra-fade-in 180ms var(--ease);
  }
  @keyframes ra-fade-in {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .ra-prompt-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
  }

<script type="text/babel">
const { useEffect, useState, useRef, useCallback } = React;

/* ── Toast host ── */
function useToasts() {
  const [toasts, setToasts] = useState([]);
  const idRef = useRef(0);
  const push = useCallback(({ msg, undo }) => {
    const id = ++idRef.current;
    setToasts(t => [...t, { id, msg, undo, leaving: false }]);
    // Auto-dismiss
    setTimeout(() => setToasts(t => t.map(x => x.id === id ? { ...x, leaving: true } : x)), 3800);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 4100);
    return id;
  }, []);
  const dismiss = useCallback((id) => {
    setToasts(t => t.map(x => x.id === id ? { ...x, leaving: true } : x));
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 220);
  }, []);
  return { toasts, push, dismiss };
}

function ToastHost({ toasts, onUndo, onDismiss }) {
  return (
    <div className="ra-toast-host">
      {toasts.map(t => (
        <div key={t.id} className="ra-toast" data-leaving={t.leaving || undefined}>
          <span className="ra-toast-dot" />
          <span className="ra-toast-msg">{t.msg}</span>
          {t.undo && (
            <button className="ra-toast-undo" onClick={() => { onUndo(t); onDismiss(t.id); }}>Undo</button>
          )}
        </div>
      ))}
    </div>
  );
}

/* ── Add interview slide-in ── */
const INTERVIEW_STAGES = ['Recruiter screen', 'Hiring manager', 'Panel', 'Final'];

function AddInterviewPanel({ onSave, onClose }) {

  // Save instantly as soon as stage is picked; date is optional and can be set before or after.
  const commit = (nextStage, nextDate) => {
    onSave({ stage: nextStage, date: nextDate });
  };

  // Close on Esc
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);

  return (
    <>
      <div className="ra-overlay" onClick={onClose} />
      <aside className="ra-slidein" role="dialog" aria-label="Add interview">

              >{s}</button>
            ))}

/* ── Main status block ── */

const UPDATE_STAGES = ['Recruiter screen', 'Hiring manager', 'Panel', 'Offer'];

function StatusBlock({ role, setRole, prompt, setPrompt, pushToast, undoRef, setInterviewOpen }) {

    if (prompt?.kind === 'close') {

                key={r}
                className="ra-chip"

                  const before = { ...role };

                  setRole(prev => ({
                    ...prev,
                    status: 'Closed',
                    state: 'closed',
                    currentState: r,
                    stage: r,
                    stageUpdatedAt: Date.now(),
                  }));
                  setPrompt(null);
                  pushToast({ msg: `Role closed · ${r}`, undo: true });

              >{r}</button>
            ))}
          </div>
        </div>
      );
    }
    if (prompt?.kind === 'stage') {
      return (
        <div className="ra-prompt">
          <div className="ra-prompt-head">
            <span className="ra-prompt-t">Move to stage…</span>
            <button className="ra-prompt-close" onClick={() => setPrompt(null)}>dismiss</button>

          <div className="ra-chips">
            {UPDATE_STAGES.map(s => (
              <button
                key={s}
                className="ra-chip"
                data-selected={role.stage === s || undefined}
                onClick={() => {
                  const before = { ...role };
                  undoRef.current = () => setRole(before);
                  setRole(prev => ({
                    ...prev,
                    status: 'In process',
                    state: 'process',
                    stage: s,
                    currentState: s,
                    stageUpdatedAt: Date.now(),

                  pushToast({ msg: `Stage updated · ${s}`, undo: true });

            ))}

      );

    return null;
  };

  const sinceStageUpdate = () => {
    if (!role.stageUpdatedAt) return null;
    const now = Date.now();
    const days = Math.max(0, Math.round((now - role.stageUpdatedAt) / 86400000));
    if (days === 0) return 'just now';
    if (days === 1) return '1 day since last update';
    return `${days} days since last update`;
  };

  // Action buttons — click-again to toggle the prompt closed.
  const togglePrompt = (kind) => setPrompt(p => p?.kind === kind ? null : { kind });

  return (
    <section className="ra-block">
      <div className="ra-block-label">Status &amp; stage</div>

      <div className="ra-status-row">
        <span className="ra-status-k">Status</span>

      <div className="ra-status-row">
        <span className="ra-status-k">{role.state === 'closed' ? 'Closed on' : 'Applied'}</span>

      <div className="ra-status-row">

        <span className="ra-status-v pulse">
          <span className="ra-pulse-dot" data-state={role.state} />
          {role.currentState}
        </span>
      </div>
      <div className="ra-status-row">
        <span className="ra-status-k">
          {role.state === 'process' ? 'Since last update' : role.state === 'closed' || role.state === 'skipped' ? 'Last touched' : 'Since applied'}
        </span>
        <span className="ra-status-v mono">
          {role.state === 'process' ? sinceStageUpdate() || '—' : role.sinceApplied}

      </div>

      {role.state === 'applied' && (
        <div className="ra-interp">

                setRole(prev => ({
                  ...prev,

          </button>
        </div>

        {renderPrompt()}

        <div className="ra-patterns-note">This contributes to your decision patterns</div>
      </div>
    </section>
  );
}

}

function formatDate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${parseInt(d,10)} ${months[parseInt(m,10)-1]} ${y}`;
}
