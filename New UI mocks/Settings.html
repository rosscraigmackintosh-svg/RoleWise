<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />
<title>Rolewise — Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  /* ══════════════════════════════════════════════════════════════════
     GLOBAL SYSTEM — identical to Overview (do not redefine)
     ══════════════════════════════════════════════════════════════════ */
  :root {
    --bg:          oklch(99% 0.003 80);
    --bg-sidebar:  oklch(97.2% 0.004 80);
    --bg-card:    #ffffff;
    --bg-hover:   oklch(96% 0.004 80);
    --bg-subtle:  oklch(97.8% 0.004 80);

    --border:     oklch(92% 0.004 80);
    --border-strong: oklch(87% 0.005 80);

    --ink:        oklch(22% 0.01 80);
    --ink-heading: oklch(18% 0.012 80);
    --ink-muted:  oklch(50% 0.01 80);
    --ink-subtle: oklch(62% 0.008 80);

    --accent:     oklch(45% 0.06 250);
    --accent-bg:  oklch(95% 0.015 250);

    --risk:       oklch(45% 0.08 40);

    --sidebar-w:  240px;
    --content-max: 1100px;
    --content-narrow: 900px;

    --radius-card: 12px;
    --radius-sm: 6px;

    --dur: 180ms;
    --ease: cubic-bezier(0.2, 0, 0, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "cv11", "ss01";
  }

  button { font-family: inherit; }
  .num { font-family: 'Geist Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  ::selection { background: var(--accent-bg); color: var(--ink-heading); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: oklch(88% 0.005 80); border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: oklch(80% 0.005 80); }

  .app {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    min-height: 100vh;
  }

  /* Sidebar (identical) */
  .sidebar {
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    padding: 24px 16px 20px;
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh;
  }
  .brand { padding: 4px 8px 28px; }
  .brand-mark { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 15px; color: var(--ink-heading); letter-spacing: -0.01em; }
  .brand-dot { width: 14px; height: 14px; background: var(--ink-heading); border-radius: 3px; position: relative; }
  .brand-dot::after { content: ''; position: absolute; inset: 3px 3px auto auto; width: 4px; height: 4px; background: var(--bg-sidebar); border-radius: 50%; }
  .brand-tag { font-size: 12px; color: var(--ink-subtle); margin-top: 6px; padding-left: 22px; letter-spacing: 0.005em; }
  .nav-group { margin-bottom: 20px; }
  .nav-label { font-size: 11px; color: var(--ink-subtle); padding: 0 8px 6px; letter-spacing: 0.04em; }
  .nav-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 10px; border-radius: var(--radius-sm);
    color: var(--ink-muted); cursor: pointer; user-select: none;
    border: none; background: transparent; width: 100%;
    text-align: left; font-size: 14px; margin-bottom: 1px; position: relative;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .nav-item:hover { background: var(--bg-hover); color: var(--ink); }
  .nav-item.active { background: var(--bg-hover); color: var(--ink-heading); font-weight: 500; }
  .nav-item.active::before { content: ''; position: absolute; left: -16px; top: 6px; bottom: 6px; width: 2px; background: var(--accent); border-radius: 0 2px 2px 0; }
  .nav-count { font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--ink-subtle); font-weight: 400; }
  .sidebar-footer { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); }
  .profile { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: var(--radius-sm); cursor: pointer; }
  .profile:hover { background: var(--bg-hover); }
  .avatar { width: 26px; height: 26px; border-radius: 5px; background: oklch(80% 0.02 60); color: oklch(30% 0.02 60); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; letter-spacing: 0.02em; }
  .profile-name { font-size: 13px; color: var(--ink); line-height: 1.1; }
  .profile-mail { font-size: 11px; color: var(--ink-subtle); line-height: 1.2; margin-top: 1px; }
  .upgrade { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-card); font-size: 12px; color: var(--ink-muted); cursor: pointer; }
  .upgrade:hover { border-color: var(--border-strong); }
  .upgrade-t { color: var(--ink-heading); font-weight: 500; font-size: 12.5px; }

  /* Main */
  .main { min-width: 0; padding: 40px 48px 80px; }
  .content { max-width: var(--content-max); margin: 0 auto; }
  .content-narrow { max-width: var(--content-narrow); }

  .page-header {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 40px; padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .page-title { font-size: 22px; font-weight: 500; color: var(--ink-heading); letter-spacing: -0.015em; margin: 0 0 4px; }
  .page-sub { font-size: 13px; color: var(--ink-muted); margin: 0; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 13px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--bg-card);
    color: var(--ink-heading);
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: all var(--dur) var(--ease);
  }
  .btn:hover { background: var(--bg-hover); }
  .btn-primary { background: var(--ink-heading); color: var(--bg); border-color: var(--ink-heading); }
  .btn-primary:hover { background: oklch(28% 0.012 80); }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--ink-muted); padding: 7px 12px; }
  .btn-ghost:hover { background: var(--bg-hover); color: var(--ink-heading); }
  .btn-danger { color: oklch(45% 0.10 25); }
  .btn-danger:hover { background: oklch(96% 0.02 25); color: oklch(40% 0.13 25); }

  section { margin-bottom: 48px; }
  section:last-child { margin-bottom: 0; }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
  }
  .card-rows { padding: 4px 24px; }

  /* ══════════════════════════════════════════════════════════════════
     SETTINGS-SPECIFIC
     ══════════════════════════════════════════════════════════════════ */

  /* Saved tag in header */
  .saved-tag {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px;
    color: var(--ink-subtle);
    font-family: 'Geist Mono', monospace;
    padding: 6px 12px;
    border-radius: 20px;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
  }
  .saved-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: oklch(55% 0.12 150);
    opacity: 0.8;
  }

  /* Section heads — typographic, no icons */
  .settings-sec-head {
    margin-bottom: 14px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: baseline;
    gap: 16px;
  }
  .settings-sec-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-heading);
    letter-spacing: -0.005em;
    display: flex; align-items: baseline; gap: 12px;
  }
  .settings-sec-num {
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    color: var(--ink-subtle);
    font-weight: 400;
    letter-spacing: 0.04em;
    min-width: 22px;
  }
  .no-numbers .settings-sec-num { display: none; }
  .settings-sec-desc {
    font-size: 12.5px;
    color: var(--ink-subtle);
    max-width: 360px;
    text-align: right;
    text-wrap: pretty;
  }

  /* Rows inside cards — label / control layout */
  .s-row {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 32px;
    padding: 18px 0;
    border-top: 1px solid var(--border);
    align-items: baseline;
  }
  .s-row-first { border-top: none; }
  .s-row-label { padding-top: 4px; }
  .s-row-k {
    font-size: 13.5px;
    color: var(--ink-heading);
    font-weight: 500;
    letter-spacing: -0.005em;
  }
  .s-row-help {
    font-size: 12px;
    color: var(--ink-subtle);
    margin-top: 3px;
    line-height: 1.4;
    text-wrap: pretty;
  }
  .s-row-control { min-width: 0; }

  /* Inputs */
  .s-input-wrap {
    display: inline-flex; align-items: center;
    border: 1px solid var(--border-strong);
    border-radius: 7px;
    background: var(--bg-card);
    padding: 0 10px;
    transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    min-width: 280px;
    max-width: 100%;
  }
  .s-input-wrap:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-bg);
  }
  .s-input-mono .s-input { font-family: 'Geist Mono', monospace; font-size: 13px; }
  .s-input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    padding: 9px 2px;
    font-family: inherit;
    font-size: 13.5px;
    color: var(--ink);
    min-width: 0;
  }
  .s-input::placeholder { color: var(--ink-subtle); }
  .s-input-aff {
    font-family: 'Geist Mono', monospace;
    font-size: 13px;
    color: var(--ink-muted);
    padding: 0 4px;
  }
  .s-input-aff-right { border-left: 1px dashed var(--border); padding-left: 10px; margin-left: 4px; }

  /* Chips */
  .s-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .s-chip {
    border: 1px solid var(--border-strong);
    background: var(--bg-card);
    color: var(--ink-muted);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 400;
    cursor: pointer;
    transition: all var(--dur) var(--ease);
    white-space: nowrap;
  }
  .s-chip:hover { background: var(--bg-hover); color: var(--ink); }
  .s-chip-on {
    background: var(--accent-bg);
    color: var(--accent);
    border-color: color-mix(in oklch, var(--accent) 30%, var(--border-strong));
    font-weight: 500;
  }
  .s-chip-on:hover { background: var(--accent-bg); }

  /* Slider */
  .s-slider-row { display: flex; align-items: center; gap: 20px; }
  .s-range {
    -webkit-appearance: none; appearance: none;
    width: 220px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .s-range::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--ink-heading);
    border: 2px solid var(--bg-card);
    box-shadow: 0 0 0 1px var(--border-strong);
    cursor: grab;
  }
  .s-range::-moz-range-thumb {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--ink-heading);
    border: 2px solid var(--bg-card);
    box-shadow: 0 0 0 1px var(--border-strong);
    cursor: grab;
  }
  .s-slider-val { font-family: 'Geist Mono', monospace; color: var(--ink-heading); font-size: 14px; min-width: 64px; }
  .s-unit { color: var(--ink-muted); margin-left: 4px; font-size: 12px; }

  /* Comp row */
  .s-comp-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .s-monthly { font-size: 12.5px; color: var(--ink-subtle); font-family: 'Geist Mono', monospace; }

  /* Toggle */
  .s-toggle {
    appearance: none;
    border: none;
    width: 34px; height: 20px;
    border-radius: 10px;
    background: oklch(85% 0.005 80);
    position: relative; cursor: pointer;
    transition: background var(--dur) var(--ease);
    padding: 0;
  }
  .s-toggle-knob {
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    background: var(--bg-card);
    border-radius: 50%;
    box-shadow: 0 1px 2px oklch(20% 0.01 80 / 0.15);
    transition: transform var(--dur) var(--ease);
  }
  .s-toggle-on {
    background: var(--ink-heading);
  }
  .s-toggle-on .s-toggle-knob { transform: translateX(14px); }

  /* Boundaries — list with bullet rule */
  .b-list {
    padding: 8px 0;
  }
  .b-row {
    display: grid;
    grid-template-columns: 22px 1fr 28px;
    align-items: center;
    gap: 10px;
    padding: 10px 24px;
    border-top: 1px dashed var(--border);
  }
  .b-row:first-child { border-top: none; }
  .b-row:hover { background: var(--bg-subtle); }
  .b-bullet {
    width: 6px; height: 6px;
    background: var(--ink-heading);
    border-radius: 50%;
    margin-left: 6px;
    opacity: 0.85;
  }
  .b-text { font-size: 14px; color: var(--ink); letter-spacing: -0.005em; }
  .b-remove {
    border: none; background: transparent;
    width: 22px; height: 22px;
    border-radius: 4px;
    color: var(--ink-subtle);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity var(--dur) var(--ease);
  }
  .b-row:hover .b-remove { opacity: 1; }
  .b-remove:hover { background: var(--bg-hover); color: var(--ink); }
  .b-empty {
    padding: 16px 24px;
    color: var(--ink-subtle);
    font-size: 13px;
    font-style: italic;
  }
  .b-add {
    display: grid;
    grid-template-columns: 22px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 12px 24px;
    border-top: 1px solid var(--border);
    background: var(--bg-subtle);
    border-radius: 0 0 var(--radius-card) var(--radius-card);
  }
  .b-add-prompt {
    color: var(--ink-subtle);
    font-size: 14px;
    font-family: 'Geist Mono', monospace;
    text-align: center;
    margin-left: 4px;
  }
  .b-add-input {
    border: none; outline: none;
    background: transparent;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    padding: 4px 0;
  }
  .b-add-input::placeholder { color: var(--ink-subtle); }
  .b-add-btn {
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--bg);
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
  }
  .b-add-btn:hover { filter: brightness(0.95); }

  /* Integrations */
  .intg-row {
    display: grid;
    grid-template-columns: 36px 1fr auto auto;
    align-items: center;
    gap: 20px;
    padding: 18px 24px;
    border-top: 1px solid var(--border);
  }
  .intg-row-first { border-top: none; }
  .intg-glyph {
    width: 36px; height: 36px;
    border-radius: 8px;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Geist Mono', monospace;
    font-size: 12px;
    color: var(--ink-muted);
    letter-spacing: 0.02em;
  }
  .intg-name { font-size: 14px; color: var(--ink-heading); font-weight: 500; }
  .intg-desc { font-size: 12.5px; color: var(--ink-subtle); margin-top: 2px; }
  .intg-status { font-size: 12px; font-family: 'Geist Mono', monospace; }
  .intg-ok { color: oklch(45% 0.10 150); display: inline-flex; align-items: center; gap: 6px; }
  .intg-ok-dot { width: 6px; height: 6px; border-radius: 50%; background: oklch(55% 0.12 150); }
  .intg-off { color: var(--ink-subtle); }

  /* Account */
  .acc-plan { display: flex; align-items: center; gap: 16px; }
  .acc-plan-name {
    font-size: 14px;
    color: var(--ink-heading);
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 6px;
    background: var(--accent-bg);
    color: var(--accent);
  }

  /* Footer */
  .settings-footer {
    margin-top: 48px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--ink-subtle);
    text-align: center;
    font-family: 'Geist Mono', monospace;
  }

  /* Tweaks panel (same visual language as Overview) */
  .tweaks {
    position: fixed;
    right: 20px; bottom: 20px;
    width: 280px;
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 8px 30px oklch(20% 0.01 80 / 0.08);
    z-index: 40;
    font-size: 13px;
  }
  .tweaks h4 { margin: 0 0 12px; font-size: 12px; font-weight: 500; color: var(--ink-heading); letter-spacing: 0.02em; text-transform: uppercase; }
  .tweak-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px dashed var(--border); }
  .tweak-row:last-child { border-bottom: none; }
  .tweak-k { font-size: 12.5px; color: var(--ink-muted); }
  .tweak-btn-group { display: inline-flex; gap: 2px; background: var(--bg-subtle); border-radius: 5px; padding: 2px; }
  .tweak-btn-group button { border: none; background: transparent; padding: 3px 8px; font-size: 11px; color: var(--ink-muted); border-radius: 4px; cursor: pointer; font-family: inherit; }
  .tweak-btn-group button.on { background: var(--bg-card); color: var(--ink-heading); box-shadow: 0 0 0 1px var(--border); }
  .swatch-row { display: inline-flex; gap: 5px; }
  .swatch { width: 18px; height: 18px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; box-shadow: 0 0 0 1px var(--border-strong); }
  .swatch.on { border-color: var(--bg-card); box-shadow: 0 0 0 1px var(--ink-heading); }

  /* Density: compact */
  .density-compact .s-row { padding: 12px 0; }
  .density-compact .card-rows { padding: 2px 20px; }
  .density-compact section { margin-bottom: 36px; }
  .density-compact .b-row { padding: 8px 20px; }
  .density-compact .intg-row { padding: 14px 20px; }

  .nav-plus-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
  }
  .upgrade-t {
    color: var(--ink-heading);
    font-weight: 500;
    font-size: 12.5px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .upgrade.is-active {
    background: var(--accent-bg);
    border-color: oklch(88% 0.025 250);
  }
  .upgrade-on {
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
    padding: 1px 6px;
    border-radius: 3px;
    background: var(--bg-card);
    border: 1px solid oklch(88% 0.025 250);
    font-weight: 500;
  }

</style>
</head>
<body>
<div id="root"></div>

<script>
  window.__TWEAKS__ = /*EDITMODE-BEGIN*/{
    "subStyle": "system",
    "accent": "ink-blue",
    "showNumbers": true,
    "density": "comfortable",
    "showIntegrations": true
  }/*EDITMODE-END*/;
</script>

<script type="text/babel" src="./data.jsx"></script>
<script type="text/babel" src="./settings-data.jsx"></script>
<script type="text/babel" src="./settings.jsx"></script>

</body>
</html>
