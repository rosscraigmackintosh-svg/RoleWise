<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />
<title>Rolewise — Applications</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  /* ══════════════════════════════════════════════════════════════════
     GLOBAL SYSTEM — identical to Overview + Roles
     ══════════════════════════════════════════════════════════════════ */
  :root {
    --bg:          oklch(99% 0.003 80);
    --bg-sidebar:  oklch(97.2% 0.004 80);
    --bg-card:    #ffffff;
    --bg-hover:   oklch(96% 0.004 80);
    --bg-subtle:  oklch(97.8% 0.004 80);

    --border:     oklch(92% 0.004 80);
    --border-strong: oklch(87% 0.005 80);

    --ink:        oklch(22% 0.01 80);
    --ink-heading: oklch(18% 0.012 80);
    --ink-muted:  oklch(50% 0.01 80);
    --ink-subtle: oklch(62% 0.008 80);

    --accent:     oklch(45% 0.06 250);
    --accent-bg:  oklch(95% 0.015 250);

    --risk:       oklch(45% 0.08 40);
    --live:       oklch(55% 0.12 150);

    --sidebar-w:  240px;
    --content-max: 1100px;

    --radius-card: 12px;
    --radius-sm: 6px;

    --dur: 180ms;
    --ease: cubic-bezier(0.2, 0, 0, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "cv11", "ss01";
  }

  button, a { font-family: inherit; }
  .num { font-family: 'Geist Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  ::selection { background: var(--accent-bg); color: var(--ink-heading); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: oklch(88% 0.005 80); border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: oklch(80% 0.005 80); }

  .app {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    min-height: 100vh;
  }

  /* === Sidebar (reused exactly) === */
  .sidebar {
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    padding: 24px 16px 20px;
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .brand { padding: 4px 8px 28px; }
  .brand-mark {
    display: flex; align-items: center; gap: 8px;
    font-weight: 500; font-size: 15px;
    color: var(--ink-heading);
    letter-spacing: -0.01em;
  }
  .brand-dot {
    width: 14px; height: 14px;
    background: var(--ink-heading);
    border-radius: 3px;
    position: relative;
  }
  .brand-dot::after {
    content: '';
    position: absolute; inset: 3px 3px auto auto;
    width: 4px; height: 4px;
    background: var(--bg-sidebar);
    border-radius: 50%;
  }
  .brand-tag {
    font-size: 12px;
    color: var(--ink-subtle);
    margin-top: 6px;
    padding-left: 22px;
    letter-spacing: 0.005em;
  }
  .nav-group { margin-bottom: 20px; }
  .nav-label {
    font-size: 11px;
    color: var(--ink-subtle);
    padding: 0 8px 6px;
    letter-spacing: 0.04em;
  }
  .nav-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 10px;
    border-radius: var(--radius-sm);
    color: var(--ink-muted);
    cursor: pointer;
    user-select: none;
    border: none; background: transparent;
    width: 100%;
    text-align: left;
    font-size: 14px;
    margin-bottom: 1px;
    position: relative;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .nav-item:hover { background: var(--bg-hover); color: var(--ink); }
  .nav-item.active {
    background: var(--bg-hover);
    color: var(--ink-heading);
    font-weight: 500;
  }
  .nav-item.active::before {
    content: '';
    position: absolute;
    left: -16px; top: 6px; bottom: 6px;
    width: 2px;
    background: var(--accent);
    border-radius: 0 2px 2px 0;
  }
  .nav-count {
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    color: var(--ink-subtle);
    font-weight: 400;
  }
  .sidebar-footer {
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .profile {
    display: flex; align-items: center; gap: 10px;
    padding: 8px;
    border-radius: var(--radius-sm);
    cursor: pointer;
  }
  .profile:hover { background: var(--bg-hover); }
  .avatar {
    width: 26px; height: 26px;
    border-radius: 5px;
    background: oklch(80% 0.02 60);
    color: oklch(30% 0.02 60);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.02em;
  }
  .profile-name { font-size: 13px; color: var(--ink); line-height: 1.1; }
  .profile-mail { font-size: 11px; color: var(--ink-subtle); line-height: 1.2; margin-top: 1px; }
  .upgrade {
    margin-top: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-card);
    font-size: 12px;
    color: var(--ink-muted);
    cursor: pointer;
  }
  .upgrade:hover { border-color: var(--border-strong); }
  .upgrade-t { color: var(--ink-heading); font-weight: 500; font-size: 12.5px; }

  /* === Main / page shell === */
  .main { min-width: 0; padding: 40px 48px 80px; }
  .content { max-width: var(--content-max); margin: 0 auto; }
  .page-header {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 40px;
  }
  .page-title {
    font-size: 28px;
    font-weight: 400;
    color: var(--ink-heading);
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin: 0 0 4px;
  }
  .page-sub {
    font-size: 13px;
    color: var(--ink-muted);
    margin: 0;
  }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--bg-card);
    color: var(--ink-heading);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--dur) var(--ease);
  }
  .btn:hover { background: var(--bg-hover); }
  .btn-primary {
    background: var(--ink-heading);
    color: var(--bg);
    border-color: var(--ink-heading);
  }
  .btn-primary:hover { background: oklch(28% 0.012 80); }

  .live-dot-sm {
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--live);
    margin-right: 8px;
    vertical-align: middle;
    position: relative;
    top: -1px;
    opacity: 0.9;
  }

  /* === Lens bar (reused from Roles) === */
  .lens-bar {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 0;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .lens {
    all: unset;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 12px;
    border-radius: 7px;
    font-size: 13px;
    color: var(--ink-muted);
    cursor: pointer;
    position: relative;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .lens:hover { background: var(--bg-hover); color: var(--ink); }
  .lens.on {
    color: var(--ink-heading);
    font-weight: 500;
  }
  .lens.on::after {
    content: '';
    position: absolute;
    left: 12px; right: 12px; bottom: -21px;
    height: 2px;
    background: var(--accent);
  }
  .lens-count {
    font-size: 11px;
    color: var(--ink-subtle);
    padding: 1px 6px;
    border-radius: 8px;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
  }
  .lens.on .lens-count { color: var(--accent); border-color: oklch(88% 0.025 250); background: var(--accent-bg); }
  .lens-sep { flex: 1; }
  .lens-ghost {
    font-size: 12px;
    color: var(--ink-subtle);
    pointer-events: none;
    gap: 5px;
  }

  /* === Groups (reused) === */
  .rl-sections { display: flex; flex-direction: column; gap: 32px; }
  .rl-group-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0 2px 0;
    margin-bottom: 10px;
  }
  .rl-group-left { display: flex; align-items: center; gap: 10px; }
  .rl-group-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-heading);
    margin: 0;
    letter-spacing: 0.01em;
  }
  .rl-group-count { font-size: 12px; color: var(--ink-subtle); }
  .rl-group-hint  { font-size: 12px; color: var(--ink-subtle); }
  .rl-group-mark {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--risk);
    opacity: 0.75;
    display: inline-block;
  }

  /* Logo (reused) */
  .rl-logo {
    width: 36px; height: 36px;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 500;
    letter-spacing: 0.02em;
  }
  .rl-salary { font-family: 'Geist Mono', monospace; font-size: 12px; color: var(--ink); }
  .rl-salary.is-missing {
    color: var(--ink-subtle);
    font-style: italic;
    font-family: 'Geist', sans-serif;
    font-size: 12.5px;
  }

  /* Empty state (reused) */
  .rl-empty {
    padding: 80px 24px;
    text-align: center;
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius-card);
    background: var(--bg-card);
  }
  .rl-empty-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border-strong); margin: 0 auto 14px; }
  .rl-empty-title { font-size: 15px; color: var(--ink-heading); font-weight: 500; margin-bottom: 4px; }
  .rl-empty-sub { font-size: 13px; color: var(--ink-muted); }

  /* Toast (reused) */
  .rl-toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%);
    padding: 10px 16px;
    background: var(--ink-heading);
    color: var(--bg);
    border-radius: 8px;
    font-size: 12.5px;
    box-shadow: 0 8px 30px oklch(20% 0.01 80 / 0.2);
    z-index: 60;
    animation: toast-in 200ms var(--ease);
  }
  @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translate(-50%, 0); } }

  /* Modal (reused) */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: oklch(20% 0.01 80 / 0.22);
    backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center;
    z-index: 50;
    animation: fadein 160ms var(--ease);
  }
  @keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
  .modal {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    width: 480px;
    padding: 28px;
    box-shadow: 0 20px 60px oklch(20% 0.01 80 / 0.10);
    animation: slideup 200ms var(--ease);
  }
  @keyframes slideup { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
  .modal h3 { font-size: 16px; font-weight: 500; margin: 0 0 4px; color: var(--ink-heading); letter-spacing: -0.01em; }
  .modal p { font-size: 13px; color: var(--ink-muted); margin: 0 0 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--ink-muted); margin-bottom: 5px; }
  .field input, .field select {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border-strong);
    border-radius: 7px;
    background: var(--bg-card);
    font-family: inherit;
    font-size: 13.5px;
    color: var(--ink);
    outline: none;
    transition: border-color var(--dur) var(--ease);
  }
  .field input:focus, .field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

  /* Stub */
  .stub-page { padding: 80px 40px; text-align: center; color: var(--ink-muted); }
  .stub-page h2 { font-weight: 500; color: var(--ink-heading); font-size: 20px; letter-spacing: -0.01em; }

  /* Tweaks panel (reused) */
  .tweaks {
    position: fixed;
    right: 20px; bottom: 20px;
    width: 280px;
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 8px 30px oklch(20% 0.01 80 / 0.08);
    z-index: 40;
    font-size: 13px;
  }
  .tweaks h4 {
    margin: 0 0 12px;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-heading);
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .tweak-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px dashed var(--border); }
  .tweak-row:last-child { border-bottom: none; }
  .tweak-k { font-size: 12.5px; color: var(--ink-muted); }
  .tweak-btn-group { display: inline-flex; gap: 2px; background: var(--bg-subtle); border-radius: 5px; padding: 2px; }
  .tweak-btn-group button {
    border: none; background: transparent;
    padding: 3px 8px;
    font-size: 11px;
    color: var(--ink-muted);
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
  }
  .tweak-btn-group button.on { background: var(--bg-card); color: var(--ink-heading); box-shadow: 0 0 0 1px var(--border); }
  .swatch-row { display: inline-flex; gap: 5px; }
  .swatch {
    width: 18px; height: 18px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent;
    box-shadow: 0 0 0 1px var(--border-strong);
  }
  .swatch.on { border-color: var(--bg-card); box-shadow: 0 0 0 1px var(--ink-heading); }

  /* ══════════════════════════════════════════════════════════════════
     APPLICATIONS-SPECIFIC
     ══════════════════════════════════════════════════════════════════ */

  /* Light summary row (calm, inline — not a dashboard) */
  .ap-summary {
    display: flex;
    align-items: baseline;
    gap: 18px;
    padding: 4px 2px 22px;
    margin-bottom: 0;
  }
  .ap-sum-item {
    display: inline-flex;
    align-items: baseline;
    gap: 7px;
  }
  .ap-sum-v {
    font-size: 18px;
    color: var(--ink-heading);
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .ap-sum-k {
    font-size: 12.5px;
    color: var(--ink-muted);
  }
  .ap-sum-sep {
    width: 1px;
    height: 14px;
    background: var(--border);
    display: inline-block;
    align-self: center;
  }

  /* Application card */
  .ap-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .ap-card {
    display: block;
    padding: 20px 22px 18px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    cursor: pointer;
    position: relative;
    transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
    outline: none;
  }
  .ap-card:hover { background: var(--bg-subtle); border-color: var(--border-strong); }
  .ap-card:focus-visible {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-bg);
  }
  .ap-card.group-attention {
    border-left: 2px solid oklch(65% 0.09 40 / 0.5);
  }
  .ap-card.group-closed { opacity: 0.72; }
  .ap-card.group-closed:hover { opacity: 1; }

  /* Card head */
  .ap-head {
    display: grid;
    grid-template-columns: 44px 1fr auto;
    gap: 16px;
    align-items: flex-start;
  }
  .ap-head-logo { padding-top: 2px; }
  .ap-head-main { min-width: 0; }
  .ap-title-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .ap-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-heading);
    letter-spacing: -0.005em;
    margin: 0;
    line-height: 1.3;
  }
  .ap-company {
    font-size: 13.5px;
    color: var(--ink-muted);
    font-weight: 400;
  }
  .ap-meta {
    font-size: 12.5px;
    color: var(--ink-muted);
    margin-top: 4px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: baseline;
  }
  .ap-meta .sep { color: var(--border-strong); }

  /* Status (right side of head) */
  .ap-status {
    text-align: right;
    padding-top: 2px;
    min-width: 160px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
  }
  .ap-status-stage {
    font-size: 12.5px;
    color: var(--ink-heading);
    font-weight: 500;
    letter-spacing: -0.005em;
    display: inline-flex;
    align-items: center;
  }
  .ap-status-sub {
    font-size: 11.5px;
    color: var(--ink-subtle);
    font-family: 'Geist Mono', monospace;
  }
  .ap-status.is-attention .ap-status-stage { color: var(--risk); }
  .ap-status.is-attention .ap-status-sub  { color: var(--risk); opacity: 0.85; }
  .ap-status.is-closed .ap-status-stage   { color: var(--ink-subtle); font-weight: 400; }
  .ap-status.is-awaiting .ap-status-stage { color: var(--ink); }

  /* Body: timeline + side context */
  .ap-body {
    display: grid;
    grid-template-columns: 1fr 210px;
    gap: 28px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
    align-items: start;
  }

  /* ── TIMELINE (key differentiator) ── */
  .ap-tl {
    list-style: none;
    margin: 0;
    padding: 2px 0 0 0;
    position: relative;
  }
  .ap-tl-item {
    position: relative;
    display: grid;
    grid-template-columns: 68px 1fr;
    gap: 14px;
    padding: 4px 0 10px;
    min-height: 22px;
    align-items: baseline;
  }
  .ap-tl-item.is-last { padding-bottom: 0; }
  /* rail */
  .ap-tl-rail {
    position: absolute;
    left: 76px;
    top: 14px;
    bottom: -4px;
    width: 1px;
    background: var(--border);
  }
  .ap-tl-item.is-last .ap-tl-rail { display: none; }
  /* dot */
  .ap-tl-dot {
    position: absolute;
    left: 73px;
    top: 8px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--bg-card);
    border: 1.5px solid var(--border-strong);
  }
  .ap-tl-item.is-subtle .ap-tl-dot { border-color: var(--border); }
  .ap-tl-item.is-live .ap-tl-dot {
    border-color: var(--live);
    background: var(--live);
    box-shadow: 0 0 0 3px oklch(55% 0.12 150 / 0.15);
  }
  .ap-tl-item.is-upcoming .ap-tl-dot {
    border-color: var(--accent);
    background: var(--bg-card);
  }
  .ap-tl-item.is-pending .ap-tl-dot {
    background: var(--bg-card);
    border: 1.5px dashed var(--border-strong);
  }
  .ap-tl-item.is-warn .ap-tl-dot {
    border-color: var(--risk);
    background: var(--bg-card);
  }
  .ap-tl-item.is-closed .ap-tl-dot {
    border-color: var(--ink-muted);
    background: var(--ink-muted);
  }

  .ap-tl-date {
    font-size: 11.5px;
    color: var(--ink-subtle);
    text-align: right;
    padding-right: 4px;
    line-height: 1.4;
    padding-top: 1px;
  }
  .ap-tl-label {
    font-size: 13px;
    color: var(--ink);
    line-height: 1.4;
    padding-left: 12px;
  }
  .ap-tl-item.is-subtle .ap-tl-label { color: var(--ink-muted); }
  .ap-tl-item.is-pending .ap-tl-label { color: var(--ink-muted); font-style: italic; }
  .ap-tl-item.is-warn .ap-tl-label { color: var(--risk); font-style: normal; }
  .ap-tl-item.is-upcoming .ap-tl-label { color: var(--accent); font-weight: 500; }
  .ap-tl-item.is-closed .ap-tl-label { color: var(--ink-muted); }

  /* Compact timeline */
  .ap-tl-dense .ap-tl-item { padding: 2px 0 5px; }
  .ap-tl-dense .ap-tl-label { font-size: 12.5px; }

  /* ── Side context (CV + response) ── */
  .ap-side {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding-top: 2px;
    border-left: 1px dashed var(--border);
    padding-left: 20px;
  }
  .ap-cv-k, .ap-resp-k {
    font-size: 11px;
    color: var(--ink-subtle);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .ap-cv-v {
    font-size: 12.5px;
    color: var(--ink);
    font-weight: 500;
    line-height: 1.35;
  }
  .ap-response {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .ap-resp-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .ap-resp-row .ap-resp-k {
    margin-bottom: 0;
    text-transform: none;
    letter-spacing: 0;
    font-size: 12px;
    color: var(--ink-muted);
  }
  .ap-resp-v {
    font-size: 12px;
    color: var(--ink);
  }

  /* ── Actions strip: subtle, appears on hover, in bottom-right ── */
  .ap-actions {
    position: absolute;
    right: 18px;
    bottom: 14px;
    display: flex;
    gap: 2px;
    padding: 4px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 4px 12px oklch(20% 0.01 80 / 0.06);
    opacity: 0;
    transform: translateY(4px);
    pointer-events: none;
    transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
  }
  .ap-card:hover .ap-actions,
  .ap-card:focus-within .ap-actions {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }
  .rl-act {
    all: unset;
    font-size: 12px;
    color: var(--ink);
    padding: 4px 9px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: 500;
    transition: background var(--dur) var(--ease);
  }
  .rl-act:hover { background: var(--bg-hover); }
  .rl-act-subtle { color: var(--ink-muted); font-weight: 400; }
  .rl-act-more { color: var(--ink-muted); }

  /* Empty group slot */
  .ap-group-empty {
    padding: 22px;
    text-align: center;
    font-size: 12.5px;
    color: var(--ink-subtle);
    border: 1px dashed var(--border);
    border-radius: var(--radius-card);
    background: var(--bg-subtle);
    font-style: italic;
  }

  /* Responsive tightening: collapse side column on narrower */
  @media (max-width: 980px) {
    .ap-body { grid-template-columns: 1fr; }
    .ap-side { border-left: none; padding-left: 0; border-top: 1px dashed var(--border); padding-top: 12px; }
  }

  .nav-plus-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
  }
  .upgrade-t {
    color: var(--ink-heading);
    font-weight: 500;
    font-size: 12.5px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .upgrade.is-active {
    background: var(--accent-bg);
    border-color: oklch(88% 0.025 250);
  }
  .upgrade-on {
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
    padding: 1px 6px;
    border-radius: 3px;
    background: var(--bg-card);
    border: 1px solid oklch(88% 0.025 250);
    font-weight: 500;
  }

</style>
</head>
