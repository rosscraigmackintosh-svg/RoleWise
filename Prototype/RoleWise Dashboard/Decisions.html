<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />
<title>Rolewise — Decision history</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  /* ══════════════════════════════════════════════════════════════════
     GLOBAL SYSTEM — identical to Overview / Review / Insights / Patterns
     ══════════════════════════════════════════════════════════════════ */
  :root {
    --bg:          oklch(99% 0.003 80);
    --bg-sidebar:  oklch(97.2% 0.004 80);
    --bg-card:    #ffffff;
    --bg-hover:   oklch(96% 0.004 80);
    --bg-subtle:  oklch(97.8% 0.004 80);

    --border:     oklch(92% 0.004 80);
    --border-strong: oklch(87% 0.005 80);

    --ink:        oklch(22% 0.01 80);
    --ink-heading: oklch(18% 0.012 80);
    --ink-muted:  oklch(50% 0.01 80);
    --ink-subtle: oklch(62% 0.008 80);

    --accent:     oklch(45% 0.06 250);
    --accent-bg:  oklch(95% 0.015 250);

    --sidebar-w:  240px;
    --content-max: 920px;

    --radius-card: 12px;
    --radius-sm: 6px;

    --dur: 180ms;
    --ease: cubic-bezier(0.2, 0, 0, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "cv11", "ss01";
  }

  button, a { font-family: inherit; }
  .num { font-family: 'Geist Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  ::selection { background: var(--accent-bg); color: var(--ink-heading); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: oklch(88% 0.005 80); border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: oklch(80% 0.005 80); }

  .app {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    min-height: 100vh;
  }

  /* Sidebar (shared) */
  .sidebar {
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    padding: 24px 16px 20px;
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh;
  }
  .brand { padding: 4px 8px 28px; }
  .brand-mark { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 15px; color: var(--ink-heading); letter-spacing: -0.01em; }
  .brand-dot { width: 14px; height: 14px; background: var(--ink-heading); border-radius: 3px; position: relative; }
  .brand-dot::after { content: ''; position: absolute; inset: 3px 3px auto auto; width: 4px; height: 4px; background: var(--bg-sidebar); border-radius: 50%; }
  .brand-tag { font-size: 12px; color: var(--ink-subtle); margin-top: 6px; padding-left: 22px; letter-spacing: 0.005em; }
  .nav-group { margin-bottom: 20px; }
  .nav-label { font-size: 11px; color: var(--ink-subtle); padding: 0 8px 6px; letter-spacing: 0.04em; }
  .nav-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 10px; border-radius: var(--radius-sm);
    color: var(--ink-muted); cursor: pointer; user-select: none;
    border: none; background: transparent; width: 100%;
    text-align: left; font-size: 14px; margin-bottom: 1px; position: relative;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .nav-item:hover { background: var(--bg-hover); color: var(--ink); }
  .nav-item.active { background: var(--bg-hover); color: var(--ink-heading); font-weight: 500; }
  .nav-item.active::before { content: ''; position: absolute; left: -16px; top: 6px; bottom: 6px; width: 2px; background: var(--accent); border-radius: 0 2px 2px 0; }
  .nav-count { font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--ink-subtle); font-weight: 400; }
  .nav-plus-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .sidebar-footer { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); }
  .profile { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: var(--radius-sm); cursor: pointer; }
  .profile:hover { background: var(--bg-hover); }
  .avatar { width: 26px; height: 26px; border-radius: 5px; background: oklch(80% 0.02 60); color: oklch(30% 0.02 60); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; letter-spacing: 0.02em; }
  .profile-name { font-size: 13px; color: var(--ink); line-height: 1.1; }
  .profile-mail { font-size: 11px; color: var(--ink-subtle); line-height: 1.2; margin-top: 1px; }
  .upgrade { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-card); font-size: 12px; color: var(--ink-muted); cursor: pointer; }
  .upgrade:hover { border-color: var(--border-strong); }
  .upgrade-t { color: var(--ink-heading); font-weight: 500; font-size: 12.5px; display: flex; align-items: center; justify-content: space-between; }
  .upgrade.is-active { background: var(--accent-bg); border-color: oklch(88% 0.025 250); }
  .upgrade-on { font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); padding: 1px 6px; border-radius: 3px; background: var(--bg-card); border: 1px solid oklch(88% 0.025 250); font-weight: 500; }

  .main { min-width: 0; padding: 64px 48px 96px; }
  .content { max-width: var(--content-max); margin: 0 auto; }

  /* Tweaks panel (shared) */
  .tweaks { position: fixed; right: 20px; bottom: 20px; width: 280px; background: var(--bg-card); border: 1px solid var(--border-strong); border-radius: 12px; padding: 16px; box-shadow: 0 8px 30px oklch(20% 0.01 80 / 0.08); z-index: 40; font-size: 13px; }
  .tweaks h4 { margin: 0 0 12px; font-size: 12px; font-weight: 500; color: var(--ink-heading); letter-spacing: 0.02em; text-transform: uppercase; }
  .tweak-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px dashed var(--border); }
  .tweak-row:last-child { border-bottom: none; }
  .tweak-k { font-size: 12.5px; color: var(--ink-muted); }
  .tweak-btn-group { display: inline-flex; gap: 2px; background: var(--bg-subtle); border-radius: 5px; padding: 2px; }
  .tweak-btn-group button { border: none; background: transparent; padding: 3px 8px; font-size: 11px; color: var(--ink-muted); border-radius: 4px; cursor: pointer; font-family: inherit; }
  .tweak-btn-group button.on { background: var(--bg-card); color: var(--ink-heading); box-shadow: 0 0 0 1px var(--border); }
  .swatch-row { display: inline-flex; gap: 5px; }
  .swatch { width: 18px; height: 18px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; box-shadow: 0 0 0 1px var(--border-strong); }
  .swatch.on { border-color: var(--bg-card); box-shadow: 0 0 0 1px var(--ink-heading); }

  /* ══════════════════════════════════════════════════════════════════
     DECISION HISTORY — page specific
     A quiet record of decisions and reasoning. Not a role list.
     ══════════════════════════════════════════════════════════════════ */

  /* Header */
  .dh-head {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 32px;
    align-items: flex-end;
    padding: 4px 0 28px;
    border-bottom: 1px solid var(--border);
  }
  .dh-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    color: var(--ink-subtle);
    letter-spacing: 0.04em;
    text-transform: lowercase;
    margin-bottom: 12px;
  }
  .dh-eyebrow-tick {
    width: 8px; height: 1px;
    background: var(--border-strong);
    display: inline-block;
  }
  .dh-title {
    margin: 0 0 6px;
    font-size: 28px;
    font-weight: 400;
    color: var(--ink-heading);
    letter-spacing: -0.02em;
    line-height: 1.15;
  }
  .dh-sub {
    margin: 0;
    font-size: 14px;
    color: var(--ink-muted);
    max-width: 52ch;
    text-wrap: pretty;
  }

  /* Filter segment */
  .dh-filter {
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-card);
    overflow: hidden;
  }
  .dh-filter-btn {
    border: none;
    background: transparent;
    padding: 0 14px;
    height: 32px;
    font-size: 12.5px;
    color: var(--ink-muted);
    cursor: pointer;
    font-family: inherit;
    letter-spacing: -0.003em;
    border-right: 1px solid var(--border);
    display: inline-flex; align-items: center; gap: 7px;
    white-space: nowrap;
  }
  .dh-filter-btn:last-child { border-right: none; }
  .dh-filter-btn:hover { background: var(--bg-hover); color: var(--ink-heading); }
  .dh-filter-btn.on { color: var(--ink-heading); font-weight: 500; background: var(--bg-subtle); }
  .dh-filter-ct {
    font-family: 'Geist Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-subtle);
    letter-spacing: 0.02em;
  }
  .dh-filter-btn.on .dh-filter-ct { color: var(--ink-muted); }

  /* Light summary — below header, inline mono text */
  .dh-summary {
    display: flex;
    align-items: baseline;
    gap: 18px;
    padding: 20px 0 2px;
    color: var(--ink-muted);
    flex-wrap: wrap;
  }
  .dh-sum-frag {
    font-size: 14px;
    color: var(--ink);
    letter-spacing: -0.003em;
  }
  .dh-sum-frag .num {
    font-size: 16px;
    color: var(--ink-heading);
    font-weight: 500;
    margin-right: 4px;
  }
  .dh-sum-dot {
    width: 3px; height: 3px;
    border-radius: 50%;
    background: var(--border-strong);
    display: inline-block;
  }
  .dh-sum-meta {
    font-family: 'Geist Mono', monospace;
    font-size: 11.5px;
    color: var(--ink-subtle);
    letter-spacing: 0.01em;
    margin-left: auto;
  }

  /* Groups — document-first. Sticky left label, body on right. */
  .dh-groups { margin-top: 40px; }
  .dh-group {
    padding: 40px 0 0;
    display: grid;
    grid-template-columns: 150px 1fr;
    gap: 32px;
    align-items: start;
  }
  .dh-group + .dh-group {
    border-top: 1px solid var(--border);
    padding-top: 40px;
    margin-top: 8px;
  }
  .dh-group:first-child { padding-top: 8px; }

  .dh-group-label {
    position: sticky;
    top: 40px;
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    color: var(--ink-subtle);
    letter-spacing: 0.04em;
    text-transform: lowercase;
    padding-top: 4px;
    line-height: 1.5;
  }
  .dh-group-num {
    display: block;
    color: var(--ink-subtle);
    opacity: 0.7;
    margin-bottom: 2px;
  }
  .dh-group-ct {
    display: block;
    margin-top: 10px;
    color: var(--ink);
    font-size: 11px;
    letter-spacing: 0.04em;
  }
  .dh-group-body { min-width: 0; }

  /* Group heading — outcome in bold, count in mono */
  .dh-group-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 14px;
  }
  .dh-group-t {
    font-size: 19px;
    color: var(--ink-heading);
    font-weight: 500;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .dh-group-t .dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--ink-subtle);
    margin-right: 10px;
    vertical-align: middle;
    transform: translateY(-2px);
  }
  .dh-group[data-outcome='applied'] .dh-group-t .dot { background: oklch(55% 0.10 150); }
  .dh-group[data-outcome='skipped'] .dh-group-t .dot { background: oklch(60% 0.04 50); }
  .dh-group[data-outcome='revisited'] .dh-group-t .dot { background: var(--accent); }

  /* Pattern callout — a small reflection at the top of each group */
  .dh-pattern {
    margin: 6px 0 22px;
    padding: 16px 18px 18px;
    background: var(--bg-subtle);
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .dh-pattern-t {
    font-size: 13.5px;
    color: var(--ink-heading);
    margin-bottom: 8px;
    letter-spacing: -0.003em;
    font-style: italic;
    font-weight: 400;
  }
  .dh-pattern-list {
    margin: 0; padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .dh-pattern-list li {
    font-size: 13.5px;
    color: var(--ink);
    line-height: 1.55;
    letter-spacing: -0.003em;
    padding: 2px 0 2px 18px;
    position: relative;
    text-wrap: pretty;
  }
  .dh-pattern-list li::before {
    content: '';
    position: absolute;
    left: 0; top: 12px;
    width: 8px;
    border-top: 1px solid var(--border-strong);
  }

  /* Decision list */
  .dh-list {
    display: flex;
    flex-direction: column;
  }
  .dh-item {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px 20px;
    align-items: baseline;
    padding: 20px 0 22px;
    border-bottom: 1px dashed var(--border);
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    transition: background var(--dur) var(--ease);
    border-radius: 4px;
    margin: 0 -10px;
    padding-left: 10px;
    padding-right: 10px;
  }
  .dh-item:hover {
    background: var(--bg-subtle);
  }
  .dh-item:last-child { border-bottom: none; }

  .dh-item-head {
    grid-column: 1;
    min-width: 0;
  }
  .dh-item-role {
    font-size: 15px;
    color: var(--ink-heading);
    font-weight: 500;
    letter-spacing: -0.005em;
    line-height: 1.3;
  }
  .dh-item-company {
    color: var(--ink-muted);
    font-weight: 400;
  }
  .dh-item-company::before {
    content: '·';
    margin: 0 7px;
    color: var(--ink-subtle);
  }
  .dh-item-ts {
    grid-column: 2;
    grid-row: 1 / 3;
    align-self: start;
    font-family: 'Geist Mono', monospace;
    font-size: 11.5px;
    color: var(--ink-subtle);
    letter-spacing: 0.005em;
    white-space: nowrap;
    padding-top: 2px;
    text-align: right;
  }
  .dh-item-ts .rel {
    display: block;
    font-size: 10.5px;
    color: var(--ink-subtle);
    opacity: 0.75;
    margin-top: 3px;
    letter-spacing: 0.04em;
    text-transform: lowercase;
  }

  .dh-item-body {
    grid-column: 1;
    padding-top: 2px;
  }
  .dh-reasons {
    list-style: none;
    margin: 0; padding: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 10px;
  }
  .dh-reasons li {
    font-size: 14px;
    color: var(--ink);
    line-height: 1.5;
    letter-spacing: -0.003em;
    padding-left: 16px;
    position: relative;
    text-wrap: pretty;
  }
  .dh-reasons li::before {
    content: '';
    position: absolute;
    left: 0; top: 10px;
    width: 8px;
    border-top: 1px solid var(--ink-subtle);
    opacity: 0.6;
  }

  .dh-signals {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    align-items: center;
    font-size: 12px;
    color: var(--ink-muted);
    letter-spacing: -0.002em;
  }
  .dh-signal.dim { color: var(--ink-subtle); font-style: italic; }
  .dh-signal + .dh-signal::before {
    content: '·';
    margin-right: 14px;
    color: var(--ink-subtle);
  }

  .dh-note {
    margin-top: 10px;
    padding: 8px 11px;
    border-left: 2px solid var(--border-strong);
    font-size: 12.5px;
    color: var(--ink-muted);
    font-style: italic;
    line-height: 1.5;
    letter-spacing: -0.003em;
    max-width: 58ch;
    text-wrap: pretty;
  }

  /* Empty state */
  .dh-empty {
    margin-top: 48px;
    padding: 72px 40px 64px;
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius-card);
    background: var(--bg-card);
    text-align: center;
  }
  .dh-empty-mark {
    width: 24px; height: 1px;
    background: var(--border-strong);
    margin: 0 auto 24px;
  }
  .dh-empty-t {
    font-size: 18px;
    font-weight: 500;
    color: var(--ink-heading);
    letter-spacing: -0.01em;
    margin-bottom: 8px;
  }
  .dh-empty-s {
    font-size: 13.5px;
    color: var(--ink-muted);
    max-width: 46ch;
    margin: 0 auto;
    line-height: 1.55;
    text-wrap: pretty;
  }

  /* Footer sign-off */
  .dh-close {
    margin-top: 56px;
    padding-top: 24px;
    border-top: 1px dashed var(--border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
  }
  .dh-close-l {
    font-size: 13px;
    color: var(--ink-muted);
    font-style: italic;
    letter-spacing: -0.003em;
    max-width: 52ch;
    text-wrap: pretty;
  }
  .dh-close-r {
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    color: var(--ink-subtle);
    letter-spacing: 0.02em;
  }

  /* Density: compact */
  [data-density='compact'] .dh-group { padding-top: 28px; gap: 24px; }
  [data-density='compact'] .dh-group + .dh-group { padding-top: 28px; }
  [data-density='compact'] .dh-item { padding: 14px 10px 15px; }
  [data-density='compact'] .dh-item-role { font-size: 14px; }
  [data-density='compact'] .dh-reasons li { font-size: 13.5px; }
  [data-density='compact'] .dh-pattern { padding: 12px 14px 14px; margin-bottom: 16px; }

  /* Hide patterns */
  [data-show-patterns='false'] .dh-pattern { display: none; }
  [data-show-revisited='false'] .dh-group[data-outcome='revisited'] { display: none; }

  /* Responsive */
  @media (max-width: 920px) {
    .dh-head { grid-template-columns: 1fr; align-items: flex-start; }
    .dh-filter { align-self: flex-start; }
    .dh-group { grid-template-columns: 1fr; gap: 12px; }
    .dh-group-label { position: static; }
    .dh-summary { gap: 12px; }
    .dh-sum-meta { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
  window.__TWEAKS__ = /*EDITMODE-BEGIN*/{
    "filter": "all",
    "density": "comfortable",
    "accent": "ink-blue",
    "showPatterns": true,
    "showRevisited": true
  }/*EDITMODE-END*/;
</script>

<script type="text/babel" src="./data.jsx"></script>
<script type="text/babel" src="./decisions-data.jsx"></script>
<script type="text/babel" src="./decisions.jsx"></script>

</body>
</html>
